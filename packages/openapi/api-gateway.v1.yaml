openapi: 3.1.0
info:
  title: school-platform API Gateway
  version: 0.1.0
  description: Minimal Sprint 0 OpenAPI skeleton for the external REST API Gateway.
servers:
  - url: http://localhost:8080
    description: Local development
security: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Health check
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness check
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /metrics:
    get:
      operationId: getMetrics
      summary: Placeholder metrics path
      responses:
        "200":
          description: Reserved local metrics placeholder response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /api/v1/ping:
    get:
      operationId: getApiV1Ping
      summary: Ping API Gateway
      responses:
        "200":
          description: API Gateway ping response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /api/v1/auth/login:
    post:
      operationId: postApiV1AuthLogin
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessResponse"
        "400":
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "403":
          description: User account is inactive or locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
components:
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          maxLength: 1024
    LoginData:
      type: object
      required:
        - user_id
        - display_name
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          format: int64
          minimum: 1
    LoginSuccessResponse:
      type: object
      required:
        - data
        - meta
        - error
      properties:
        data:
          $ref: "#/components/schemas/LoginData"
        meta:
          type: "null"
        error:
          type: "null"
    StandardResponse:
      type: object
      required:
        - data
        - meta
        - error
      properties:
        data:
          description: Response payload.
        meta:
          description: Pagination or response metadata.
          anyOf:
            - type: object
            - type: "null"
        error:
          anyOf:
            - $ref: "#/components/schemas/ErrorBody"
            - type: "null"
    ErrorBody:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Data yang dikirim tidak valid.
        details:
          description: Structured error details.
          anyOf:
            - type: object
            - type: "null"
