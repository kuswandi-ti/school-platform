openapi: 3.1.0
info:
  title: school-platform API Gateway
  version: 0.1.0
  description: Minimal Sprint 0 OpenAPI skeleton for the external REST API Gateway.
servers:
  - url: http://localhost:8080
    description: Local development
security: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Health check
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness check
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /metrics:
    get:
      operationId: getMetrics
      summary: Placeholder metrics path
      responses:
        "200":
          description: Reserved local metrics placeholder response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /api/v1/ping:
    get:
      operationId: getApiV1Ping
      summary: Ping API Gateway
      responses:
        "200":
          description: API Gateway ping response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /api/v1/auth/login:
    post:
      operationId: postApiV1AuthLogin
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessResponse"
        "400":
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "403":
          description: User account is inactive or locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /api/v1/auth/refresh:
    post:
      operationId: postApiV1AuthRefresh
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh token rotated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSuccessResponse"
        "400":
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Refresh token is invalid, expired, revoked, or reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /api/v1/auth/logout:
    post:
      operationId: postApiV1AuthLogout
      summary: Revoke the current user session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Current session revoked successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccessResponse"
        "400":
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Access token or session is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "403":
          description: Session does not belong to the authenticated actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /api/v1/foundations/current:
    get:
      operationId: getCurrentFoundation
      summary: Get the authenticated Admin Yayasan foundation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current foundation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "403":
          description: Actor is not an authorized Admin Yayasan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /api/v1/schools:
    get:
      operationId: listSchools
      summary: List schools in the actor foundation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Foundation-scoped school list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "403":
          description: Actor is not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
    post:
      operationId: createSchool
      summary: Create a school in the actor foundation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchoolRequest"
      responses:
        "201":
          description: School created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "409":
          description: School code or NPSN already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "422":
          description: Invalid school data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
  /api/v1/schools/{school_id}:
    patch:
      operationId: updateSchool
      summary: Update a school in the actor foundation
      security:
        - bearerAuth: []
      parameters:
        - name: school_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSchoolRequest"
      responses:
        "200":
          description: School updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "404":
          description: School is missing or outside the actor foundation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "422":
          description: Invalid school data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          maxLength: 1024
    LoginData:
      type: object
      required:
        - user_id
        - display_name
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          format: int64
          minimum: 1
    LoginSuccessResponse:
      type: object
      required:
        - data
        - meta
        - error
      properties:
        data:
          $ref: "#/components/schemas/LoginData"
        meta:
          type: "null"
        error:
          type: "null"
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          maxLength: 1024
    RefreshData:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          format: int64
          minimum: 1
    RefreshSuccessResponse:
      type: object
      required:
        - data
        - meta
        - error
      properties:
        data:
          $ref: "#/components/schemas/RefreshData"
        meta:
          type: "null"
        error:
          type: "null"
    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          maxLength: 1024
    LogoutData:
      type: object
      required:
        - logged_out
      properties:
        logged_out:
          type: boolean
          const: true
    LogoutSuccessResponse:
      type: object
      required:
        - data
        - meta
        - error
      properties:
        data:
          $ref: "#/components/schemas/LogoutData"
        meta:
          type: "null"
        error:
          type: "null"
    CreateSchoolRequest:
      type: object
      additionalProperties: false
      required: [school_code, name, school_level, status]
      properties:
        school_code: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 150 }
        school_level:
          type: string
          enum: [kindergarten, elementary, junior_high, senior_high]
        npsn: { type: string, maxLength: 50 }
        address: { type: string, maxLength: 4000 }
        phone: { type: string, maxLength: 50 }
        email: { type: string, format: email, maxLength: 255 }
        logo_file_id: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive] }
    UpdateSchoolRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        school_code: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 150 }
        school_level:
          type: string
          enum: [kindergarten, elementary, junior_high, senior_high]
        npsn: { type: string, maxLength: 50 }
        address: { type: string, maxLength: 4000 }
        phone: { type: string, maxLength: 50 }
        email: { type: string, format: email, maxLength: 255 }
        logo_file_id: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive] }
    StandardResponse:
      type: object
      required:
        - data
        - meta
        - error
      properties:
        data:
          description: Response payload.
        meta:
          description: Pagination or response metadata.
          anyOf:
            - type: object
            - type: "null"
        error:
          anyOf:
            - $ref: "#/components/schemas/ErrorBody"
            - type: "null"
    ErrorBody:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Data yang dikirim tidak valid.
        details:
          description: Structured error details.
          anyOf:
            - type: object
            - type: "null"
