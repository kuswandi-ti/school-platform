syntax = "proto3";

package schoolplatform.identity.v1;

option go_package = "school-platform/packages/proto/gen/go/identity/v1;identityv1";

service IdentityService {
  rpc Login(LoginRequest) returns (LoginResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string request_id = 3;
  string correlation_id = 4;
  string ip_address = 5;
  string user_agent = 6;
}

message LoginResponse {
  string user_id = 1;
  string display_name = 2;
  string access_token = 3;
  string refresh_token = 4;
  string token_type = 5;
  int64 expires_in = 6;
}
