name: CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
  push:
    branches:
      - develop
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-check:
    name: Repository Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "AGENTS.md"
            "SKILLS.md"
            "README.md"
            "Makefile"
            ".gitignore"
            ".env.example"
            "docs/README.md"
            "docs/08-coding-standard.md"
            "docs/09-ai-agent-rules.md"
            "docs/10-sprint-backlog-mvp.md"
            "docs/11-github-repository-rules.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Check no local environment files are committed
        shell: bash
        run: |
          set -euo pipefail

          disallowed_files=$(find . \
            -path "./.git" -prune -o \
            -type f \( \
              -name ".env" -o \
              -name ".env.local" -o \
              -name ".env.development" -o \
              -name ".env.staging" -o \
              -name ".env.production" \
            \) -print)

          if [ -n "$disallowed_files" ]; then
            echo "Do not commit local environment files:"
            echo "$disallowed_files"
            exit 1
          fi

      - name: Check no private keys are committed
        shell: bash
        run: |
          set -euo pipefail

          private_keys=$(find . \
            -path "./.git" -prune -o \
            -type f \( \
              -name "*.pem" -o \
              -name "*.key" -o \
              -name "*.p12" -o \
              -name "*.pfx" -o \
              -name "id_rsa" -o \
              -name "id_ed25519" \
            \) -print)

          if [ -n "$private_keys" ]; then
            echo "Potential private key files must not be committed:"
            echo "$private_keys"
            exit 1
          fi

  yaml-check:
    name: YAML Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML parses
        shell: bash
        run: |
          set -euo pipefail

          files=$(find . \
            -path "./.git" -prune -o \
            -type f \( -name "*.yml" -o -name "*.yaml" \) -print | sort)

          if [ -z "$files" ]; then
            echo "No YAML files found."
            exit 0
          fi

          ruby -e '
            require "yaml"
            ARGV.each do |path|
              begin
                YAML.load_file(path)
              rescue Psych::Exception => e
                warn "Invalid YAML: #{path}"
                warn e.message
                exit 1
              end
            end
            puts "Validated #{ARGV.length} YAML file(s)."
          ' $files

  go-check:
    name: Go Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Go modules
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          modules=$(find services packages -name go.mod -not -path "*/vendor/*" -print | sort)

          if [ -z "$modules" ]; then
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "No Go modules found. Skipping Go checks."
          else
            echo "has_go=true" >> "$GITHUB_OUTPUT"
            echo "Go modules found:"
            echo "$modules"
          fi

      - name: Setup Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Run gofmt, go vet, and go test
        if: steps.detect.outputs.has_go == 'true'
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r mod_file; do
            module_dir=$(dirname "$mod_file")
            echo "Checking Go module: $module_dir"

            pushd "$module_dir" >/dev/null

            unformatted=$(gofmt -l $(find . -name "*.go" -not -path "./vendor/*"))
            if [ -n "$unformatted" ]; then
              echo "The following Go files need gofmt:"
              echo "$unformatted"
              exit 1
            fi

            go vet ./...
            go test ./... -count=1

            popd >/dev/null
          done < <(find services packages -name go.mod -not -path "*/vendor/*" -print | sort)

  contract-check:
    name: Contract Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check proto placeholders
        shell: bash
        run: |
          set -euo pipefail

          required_dirs=(
            "packages/proto/identity/v1"
            "packages/proto/schoolcore/v1"
            "packages/proto/admission/v1"
            "packages/proto/academic/v1"
            "packages/proto/finance/v1"
            "packages/proto/communication/v1"
            "packages/proto/reporting/v1"
            "packages/proto/common/v1"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Missing proto placeholder directory: $dir"
              exit 1
            fi
          done

      - name: Check OpenAPI placeholder
        shell: bash
        run: make openapi-check

      - name: Check event schema placeholder
        shell: bash
        run: make event-schema-check

  web-check:
    name: Web Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect web app
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "apps/web-admin/package.json" ]; then
            echo "has_web=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_web=false" >> "$GITHUB_OUTPUT"
            echo "apps/web-admin/package.json not found. Skipping web checks."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.has_web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and check web app
        if: steps.detect.outputs.has_web == 'true'
        shell: bash
        working-directory: apps/web-admin
        run: |
          set -euo pipefail

          if [ -f "pnpm-lock.yaml" ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm lint
            pnpm typecheck
            pnpm build
          elif [ -f "package-lock.json" ]; then
            npm ci
            npm run lint --if-present
            npm run typecheck --if-present
            npm run build --if-present
          else
            npm install
            npm run lint --if-present
            npm run typecheck --if-present
            npm run build --if-present
          fi

  mobile-check:
    name: Mobile Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter app
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "apps/mobile-app/pubspec.yaml" ]; then
            echo "has_flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_flutter=false" >> "$GITHUB_OUTPUT"
            echo "apps/mobile-app/pubspec.yaml not found. Skipping Flutter checks."
          fi

      - name: Setup Flutter
        if: steps.detect.outputs.has_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze and test Flutter app
        if: steps.detect.outputs.has_flutter == 'true'
        shell: bash
        working-directory: apps/mobile-app
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

  docker-compose-check:
    name: Docker Compose Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "docker-compose.yml" ]; then
            echo "docker-compose.yml not found. Skipping."
            exit 0
          fi

          docker compose -f docker-compose.yml config >/dev/null

  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    needs:
      - repository-check
      - yaml-check
      - go-check
      - contract-check
      - web-check
      - mobile-check
      - docker-compose-check
    if: always()

    steps:
      - name: Verify all required jobs passed
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = []

          for name, data in needs.items():
              result = data.get("result")
              if result not in {"success", "skipped"}:
                  failed.append((name, result))

          if failed:
              print("Some CI jobs failed:")
              for name, result in failed:
                  print(f"- {name}: {result}")
              sys.exit(1)

          print("All CI jobs passed.")
          PY
