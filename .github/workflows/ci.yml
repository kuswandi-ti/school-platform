name: CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
  push:
    branches:
      - develop
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-check:
    name: Repository Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required root files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "AGENTS.md"
            "SKILLS.md"
            "docs/README.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Check required documentation files when docs folder exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "docs" ]; then
            echo "docs directory does not exist yet. Skipping docs completeness check."
            exit 0
          fi

          required_docs=(
            "docs/01-technical-architecture.md"
            "docs/02-service-boundary.md"
            "docs/03-data-model-mvp.md"
            "docs/04-api-contract.md"
            "docs/05-event-contract.md"
            "docs/06-ui-screen-user-flow.md"
            "docs/07-test-plan-acceptance-criteria.md"
            "docs/08-coding-standard.md"
            "docs/09-ai-agent-rules.md"
            "docs/10-sprint-backlog-mvp.md"
            "docs/11-github-repository-rules.md"
            "docs/12-ai-agent-sprint-prompts.md"
            "docs/24-local-development-guide.md"
          )

          for file in "${required_docs[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required documentation file: $file"
              exit 1
            fi
          done

      - name: Check no environment files are committed
        shell: bash
        run: |
          set -euo pipefail

          disallowed_files=$(find . \
            -path "./.git" -prune -o \
            -type f \( \
              -name ".env" -o \
              -name ".env.local" -o \
              -name ".env.development" -o \
              -name ".env.staging" -o \
              -name ".env.production" \
            \) -print)

          if [ -n "$disallowed_files" ]; then
            echo "Do not commit environment files:"
            echo "$disallowed_files"
            exit 1
          fi

      - name: Check no private keys are committed
        shell: bash
        run: |
          set -euo pipefail

          private_keys=$(find . \
            -path "./.git" -prune -o \
            -type f \( \
              -name "*.pem" -o \
              -name "*.key" -o \
              -name "id_rsa" -o \
              -name "id_ed25519" \
            \) -print)

          if [ -n "$private_keys" ]; then
            echo "Potential private key files must not be committed:"
            echo "$private_keys"
            exit 1
          fi

      - name: List markdown documentation
        shell: bash
        run: |
          set -euo pipefail
          find . -path "./.git" -prune -o -name "*.md" -print | sort

  yaml-check:
    name: YAML Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import pathlib
          import sys
          import yaml

          paths = [
              p for p in pathlib.Path(".").rglob("*")
              if p.is_file()
              and p.suffix.lower() in {".yml", ".yaml"}
              and ".git" not in p.parts
          ]

          for path in paths:
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"Invalid YAML: {path}")
                  print(exc)
                  sys.exit(1)

          print(f"Validated {len(paths)} YAML file(s).")
          PY

  go-check:
    name: Go Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Go modules
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          modules=$(find . -path "./.git" -prune -o -name "go.mod" -print | sort)

          if [ -z "$modules" ]; then
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "No Go modules found. Skipping Go checks."
          else
            echo "has_go=true" >> "$GITHUB_OUTPUT"
            echo "Go modules found:"
            echo "$modules"
          fi

      - name: Setup Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Run Go fmt/vet/test per module
        if: steps.detect.outputs.has_go == 'true'
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r mod_file; do
            module_dir=$(dirname "$mod_file")
            echo "Checking Go module: $module_dir"

            pushd "$module_dir" >/dev/null

            echo "Running gofmt check..."
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "The following Go files need gofmt:"
              echo "$unformatted"
              exit 1
            fi

            echo "Running go vet..."
            go vet ./...

            echo "Running go test..."
            go test ./... -count=1 -race -cover

            popd >/dev/null
          done < <(find . -path "./.git" -prune -o -name "go.mod" -print | sort)

  web-check:
    name: Web Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect web app
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "package.json" ]; then
            echo "has_web=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_web=false" >> "$GITHUB_OUTPUT"
            echo "apps/web-admin/package.json not found. Skipping web checks."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.has_web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web-admin/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.has_web == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run web lint
        if: steps.detect.outputs.has_web == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run lint --if-present

      - name: Run web typecheck
        if: steps.detect.outputs.has_web == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck --if-present

      - name: Run web tests
        if: steps.detect.outputs.has_web == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm test --if-present

      - name: Run web build
        if: steps.detect.outputs.has_web == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run build --if-present

  mobile-check:
    name: Mobile Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter app
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "pubspec.yaml" ]; then
            echo "has_flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_flutter=false" >> "$GITHUB_OUTPUT"
            echo "apps/mobile-app/pubspec.yaml not found. Skipping Flutter checks."
          fi

      - name: Setup Flutter
        if: steps.detect.outputs.has_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        if: steps.detect.outputs.has_flutter == 'true'
        shell: bash
        run: flutter pub get

      - name: Flutter analyze
        if: steps.detect.outputs.has_flutter == 'true'
        shell: bash
        run: flutter analyze

      - name: Flutter test
        if: steps.detect.outputs.has_flutter == 'true'
        shell: bash
        run: flutter test

  docker-compose-check:
    name: Docker Compose Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        shell: bash
        run: |
          set -euo pipefail

          compose_files=$(find . -maxdepth 3 -type f \( -name "docker-compose.yml" -o -name "docker-compose.yaml" -o -name "compose.yml" -o -name "compose.yaml" \) | sort)

          if [ -z "$compose_files" ]; then
            echo "No Docker Compose file found. Skipping."
            exit 0
          fi

          for file in $compose_files; do
            echo "Validating $file"
            docker compose -f "$file" config >/dev/null
          done

  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    needs:
      - repository-check
      - yaml-check
      - go-check
      - web-check
      - mobile-check
      - docker-compose-check
    if: always()

    steps:
      - name: Verify all required jobs passed
        shell: bash
        run: |
          set -euo pipefail

          results='${{ toJson(needs) }}'
          echo "$results"

          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = []

          for name, data in needs.items():
              result = data.get("result")
              if result not in {"success", "skipped"}:
                  failed.append((name, result))

          if failed:
              print("Some CI jobs failed:")
              for name, result in failed:
                  print(f"- {name}: {result}")
              sys.exit(1)

          print("All CI jobs passed.")
          PY
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
